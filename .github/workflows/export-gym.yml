name: Exportar Gym para Garmin

on:
  workflow_dispatch:
    inputs:
      dia:
        description: "Dia do treino (A, B ou C)"
        required: true
        default: "A"
        type: choice
        options: [A, B, C]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install "garminconnect>=0.2.22,<0.3"

      - name: Restaurar sessão Garmin
        uses: actions/cache@v4
        with:
          path: /tmp/garmin_cache
          key: garmin-session-v3-${{ github.run_id }}
          restore-keys: |
            garmin-session-v3-
            garmin-session-v2

      - name: Bootstrap tokens do secret (se cache vazio)
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: |
          if [ ! -f /tmp/garmin_cache/oauth1_token.json ] && [ -n "$GARMIN_TOKENS" ]; then
            mkdir -p /tmp/garmin_cache
            echo "$GARMIN_TOKENS" | base64 -d | tar -xz -C /tmp/garmin_cache
            echo "✅ Tokens restaurados do secret GARMIN_TOKENS"
          else
            echo "Cache já tem tokens ou secret não configurado"
          fi

      - name: Exportar treino
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          DIA:             ${{ inputs.dia }}
        run: python export_gym.py
