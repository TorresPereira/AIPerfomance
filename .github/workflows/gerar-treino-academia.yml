name: Gerar Treino de Academia

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-treino:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar treino
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python gerar_treino_academia.py

      - name: Sincronizar pwa para docs
        run: |
          mkdir -p docs
          cp -r pwa/. docs/

      - name: Publicar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pwa/treino_academia.json docs/
          git commit -m "💪 treino de academia $(date +'%Y-%m-%d %H:%M UTC')" || true
          if ! git push origin HEAD:main; then
            echo "Push rejeitado — tentando de novo..."
            git fetch origin main --quiet
            git push --force-with-lease origin HEAD:main
          fi
